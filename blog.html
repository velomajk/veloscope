<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog — Veloscope</title>
  <meta name="description" content="Notes on delivery, data, and Jira — insights on forecasting, project management, and building Veloscope.">
  <link rel="canonical" href="https://veloscope.me/blog.html">
  <meta property="og:title" content="Blog — Veloscope">
  <meta property="og:description" content="Notes on delivery, data, and Jira — insights on forecasting, project management, and building Veloscope.">
  <meta property="og:url" content="https://veloscope.me/blog.html">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Blog — Veloscope">
  <meta name="twitter:description" content="Notes on delivery, data, and Jira — insights on forecasting, project management, and building Veloscope.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BWNBKF4TES"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-BWNBKF4TES');
  </script>
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark-theme');
        } else if (theme === 'light' || (!theme && window.matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.classList.add('light-theme');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/src/css/style.css">
  <style>
    html.dark-theme { background-color: #0B1120; color: #FFFFFF; }
    html.light-theme { background-color: #F8FAFC; color: #0F172A; }
    body { margin: 0; }
  </style>
</head>

<body>
  <div class="vs-app" id="app">
    <main>
      <section class="vs-section">
        <div class="vs-blog-head">
          <span class="vs-blog-eyebrow">Blog</span>
          <h1 class="vs-blog-h1">Notes on delivery, data, and Jira</h1>
        </div>
        <a class="vs-feat" id="blog-featured" href="#"></a>
        <div class="vs-blog-grid" id="blog-rest"></div>
      </section>
    </main>
  </div>

  <script type="module" src="/src/site.js"></script>
  <script type="module">
    function fmt(iso) {
      const d = new Date(iso);
      return isNaN(d) ? iso : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }
    // Prefer the real post image; fall back to the gradient art when absent.
    const bg = (p) => p.thumbnail ? `center/cover no-repeat url('${p.thumbnail}')` : (p.art || 'linear-gradient(135deg,#0ea5e9,#1e3a8a)');
    const featured = document.getElementById('blog-featured');
    const rest = document.getElementById('blog-rest');
    fetch('/blog/posts.json')
      .then((r) => r.json())
      .then((posts) => {
        if (!posts.length) { featured.remove(); rest.innerHTML = '<p style="color:var(--text-secondary)">No posts yet.</p>'; return; }
        const f = posts[0];
        featured.href = `/blog/${f.id}/`;
        featured.innerHTML = `
          <div class="vs-feat-art" style="background:${bg(f)}">
            <span class="vs-feat-tag">FEATURED · ${f.tag || 'BLOG'}</span>
          </div>
          <div class="vs-feat-body">
            <span class="vs-feat-date">${fmt(f.date)}</span>
            <span class="vs-feat-title">${f.title}</span>
            <span class="vs-feat-excerpt">${f.excerpt || ''}</span>
            <div class="vs-feat-author"><span class="vs-avatar">M</span><span class="vs-feat-author-name">Majk · Founder, Veloscope</span></div>
          </div>`;
        rest.innerHTML = posts.slice(1).map((p) => `
          <a class="vs-post-card" href="/blog/${p.id}/">
            <div class="vs-post-card-art" style="background:${bg(p)}">
              <span class="vs-blog-tag">${p.tag || 'BLOG'}</span>
            </div>
            <div class="vs-post-card-body">
              <span class="vs-blog-date">${fmt(p.date)}</span>
              <span class="vs-blog-title">${p.title}</span>
              <span class="vs-post-card-excerpt">${p.excerpt || ''}</span>
              <span class="vs-post-card-readmore">Read more →</span>
            </div>
          </a>`).join('');
      })
      .catch(() => { featured.remove(); rest.innerHTML = '<p style="color:var(--text-secondary)">Could not load posts.</p>'; });
  </script>
</body>

</html>
