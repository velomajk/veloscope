<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - Veloscope</title>
  <meta name="description" content="Get in touch with the Veloscope team. Reach out for support, feedback, or partnership inquiries.">
  <link rel="canonical" href="https://veloscope.me/contact.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BWNBKF4TES"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-BWNBKF4TES');
  </script>
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark-theme');
        } else if (theme === 'light' || (!theme && window.matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.classList.add('light-theme');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/src/css/style.css">
  <style>
    html.dark-theme { background-color: #0B1120; color: #FFFFFF; }
    html.light-theme { background-color: #F8FAFC; color: #0F172A; }
    body { margin: 0; }
  </style>
</head>

<body>
  <div class="vs-app" id="app">
    <main>
      <div class="vs-legal">
        <div id="contact-content" class="vs-prose">Loading contact info…</div>
      </div>
    </main>
  </div>

  <script type="module" src="/src/site.js"></script>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
