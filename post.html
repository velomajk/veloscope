<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post - Veloscope Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BWNBKF4TES"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-BWNBKF4TES');
    </script>
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark-theme');
        } else if (theme === 'light' || (!theme && window.matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.classList.add('light-theme');
        }
      } catch (e) {}
    })();
  </script>
    <link rel="stylesheet" href="/src/css/style.css">
  <style>
    html.dark-theme { background-color: #0B1120; color: #FFFFFF; }
    html.light-theme { background-color: #F8FAFC; color: #0F172A; }
    body { margin: 0; }
  </style>
</head>

<body>
    <div class="vs-app" id="app">
        <main>
            <div class="vs-post">
                <a href="/blog.html" class="vs-post-back">← All posts</a>
                <div id="post-meta" class="post-meta"></div>
                <div id="post-content" class="markdown-body blog-post-body">
                    Loading Post...
                </div>
                <div class="vs-post-related" id="post-related" hidden>
                    <span class="vs-post-related-label">Related posts</span>
                    <div class="vs-post-related-grid" id="post-related-grid"></div>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="/src/site.js"></script>
    <script type="module" src="/src/main.js"></script>
    <script type="module">
      function fmt(iso) {
        const d = new Date(iso);
        return isNaN(d) ? iso : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      }
      let id = new URLSearchParams(location.search).get('id');
      if (!id) { const m = location.pathname.match(/\/blog\/([^/]+)\/?$/); if (m) id = m[1]; }
      fetch('/blog/posts.json')
        .then((r) => r.json())
        .then((posts) => {
          const others = posts.filter((p) => p.id !== id).slice(0, 2);
          if (!others.length) return;
          const wrap = document.getElementById('post-related');
          document.getElementById('post-related-grid').innerHTML = others.map((p) => `
            <a class="vs-post-related-card" href="/blog/${p.id}/">
              <span class="vs-post-related-date">${fmt(p.date)}</span>
              <span class="vs-post-related-title">${p.title}</span>
            </a>`).join('');
          wrap.hidden = false;
        })
        .catch(() => {});
    </script>
</body>

</html>
